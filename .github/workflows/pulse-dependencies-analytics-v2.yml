name: Pulse - Dependency Analytics

on:
  workflow_call:
    inputs:
      PULSE_URL:
        type: string
        default: 'https://a0lrn1xwl4.execute-api.eu-west-1.amazonaws.com'
      before_step_command:
        type: string
        default: ''
      after_step_command:
        type: string
        default: ''
jobs:
  pulse_dependencies_report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v2
        with:
          node-version: '20'

      - name: Install jq and curl
        run: sudo apt-get install -y jq curl

      - name: before step
        if: ${{ inputs.before_step_command != '' }}
        run: |
          ${{ inputs.before_step_command}}
      - name: Install dependencies
        run: npm install
      - name: Capture installed dependencies
        run: npm list --depth=0 --json > installed-deps.json || true
      - name: Read dependencies
        run: |
          #!/bin/bash

          # All version/dependency data from installed-deps.json.
          # package.json used ONLY for coreDependencies (engines).

          installed_deps=$(cat installed-deps.json)
          package_json=$(cat package.json)

          # coreDependencies from package.json "engines" only (e.g. node, npm)
          core_dependencies_array='[]'
          engines=$(echo "$package_json" | jq -c '.engines // {}')
          if [ "$engines" != "{}" ]; then
            for key in $(echo "$engines" | jq -r 'keys[]'); do
              core_version=$(echo "$engines" | jq -r ".[\"$key\"]" | sed 's/^[^0-9]*//')
              core_dependencies_array=$(echo "$core_dependencies_array" | jq \
                --arg name "$key" --arg v "$core_version" \
                '. += [{ "dependencyName": $name, "currentVersion": $v }]')
            done
          fi

          # Output: installed-deps.json format (all data from installed-deps.json) + coreDependencies from package.json
          echo "$installed_deps" | jq --argjson core "$core_dependencies_array" \
            '. + { "coreDependencies": $core }' \
            > pulse-version-upgrades-report.json

          echo "Dependency list (dependencyName and version updated):"
          echo "$installed_deps" | jq -r '.dependencies | to_entries[] | "  \(.key): \(.value.version)"'

          echo "Wrote pulse-version-upgrades-report.json (versions from installed-deps.json, coreDependencies from package.json engines only)"

      - name: Upload Version Upgrades Report Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pulse-version-upgrades-report
          path: pulse-version-upgrades-report.json

      - name: after step
        if: ${{ inputs.after_step_command != '' }}
        run: |
          ${{ inputs.after_step_command}}
